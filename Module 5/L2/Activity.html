<!doctype html>
<html>
  <head>
    <title>Module 5 - Lesson 2 - Activity 1 - My Planet Cards</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <style>
      body {
        font-family: Arial;
        background: #f0f4ff;
        padding: 30px;
        text-align: center;
      }
      h1 {
        color: #0ea75b;
      }
      p {
        color: #555;
      }
      .planet-name {
        font-size: 22px;
        font-weight: bold;
        color: #333;
      }
      .planet-fact {
        color: #666;
        margin-top: 10px;
        font-size: 14px;
      }
      button {
        background: #0ea75b;
        color: white;
        border: none;
        padding: 12px 28px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <h1>🌎 My Planet Cards</h1>
    <p>Use a JavaScript class to build planet cards!</p>
    <button onclick="showPlanets()">Show Planets!</button>
    <div class="container mt-5">
      <div class="row">
        <div class="col-4">
          <div id="card1"></div>
        </div>
        <div class="col-4">
          <div id="card2"></div>
        </div>
        <div class="col-4">
          <div id="card3"></div>
        </div>
      </div>
    </div>
    
    <script>
        class Planet {
            constructor(name, distanceFromSun, fact, moons) {
                this.name = name;
                this.fact= fact;
                this.moons= moons;
                this.distanceFromSun= distanceFromSun;
            }

            describe() {
                return this.name;
            }

            createCard() {
                return `<div class = "card shadow p-2 border border-success border-3">
                    <div class="card-body">
                        <div class="planet-name">
                            ${this.name}
                        </div>
                        
                        <div class="planet-fact">${this.fact}

                            <p>Distance from Sun: ${this.distanceFromSun} million kms</p>

                                <p>No. of moons: ${this.moons}</p>


                            </div>
                        </div>    
                    </div>`;
            }
        }

        function showPlanets() {
            let p1 = new Planet("Earth", 149.6, "The only only planet with life", 1);
             let p2 = new Planet("Mars", 227.9, "Known as the red planet", 1);
              let p3 = new Planet("Saturn", 1433.5, "Has rings made of ice", 93);

            document.getElementById("card1").innerHTML = p1.createCard();
            document.getElementById("card2").innerHTML = p2.createCard();
            document.getElementById("card3").innerHTML = p3.createCard();
        }
    </script>
  </body>
</html>
