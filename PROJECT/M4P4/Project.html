<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Favourite Person Profile</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet">
  <style>
    body { background-color: #F0F0F2; }
    h1   { color: #FF5A43; }
    .card-label { font-size: 11px; color: #999; text-transform: uppercase; }
    pre  { font-size: 13px; color: #333; }
  </style>
</head>
<body class="py-10">

  <div class="container">

    <h1 class="mb-1">My Favourite Person Profile</h1>
    <p class="text-muted mb-10">
      Introduction to Objects in JavaScript 
    </p>

    <!-- Profile Card -->
    <div class="card shadow-sm mb-3" style="max-width:400px;">
      <div class="card-body">
        <h5 class="card-title" style="color:#FF5A43;">Profile Details</h5>
        <ul class="list-group list-group-flush">
          <li class="list-group-item">
            <span class="card-label d-block">Name</span>
            <strong id="name">-</strong>
          </li>
          <li class="list-group-item">
            <span class="card-label d-block">Relationship</span>
            <strong id="relationship">-</strong>
          </li>
          <li class="list-group-item">
            <span class="card-label d-block">Favourite Activity</span>
            <strong id="activity">-</strong>
          </li>
          <li class="list-group-item">
            <span class="card-label d-block">City</span>
            <strong id="city">-</strong>
          </li>
            <li class="list-group-item">
            <span class="card-label d-block">Height</span>
            <strong id="height">-</strong>
          </li>
            <li class="list-group-item">
            <span class="card-label d-block">Age</span>
            <strong id="age">-</strong>
          </li>
            <li class="list-group-item">
            <span class="card-label d-block">School</span>
            <strong id="school">-</strong>
          </li>
            <li class="list-group-item">
            <span class="card-label d-block">Favourite Food</span>
            <strong id="food">-</strong>
          </li>
            <li class="list-group-item">
            <span class="card-label d-block">Favourite TV Show</span>
            <strong id="show">-</strong>
          </li>
            <li class="list-group-item">
            <span class="card-label d-block">Skin Tone</span>
            <strong id="tone">-</strong>
          </li>
        </ul>
      </div>
    </div>

    <!-- Code Box -->
    <div class="card shadow-sm" style="max-width:400px;">
      <div class="card-body">
        <h6 style="color:#FF5A43;">JavaScript Object Used</h6>
        <pre id="codeDisplay"
          class="bg-light p-3 rounded border mb-0"></pre>
      </div>
    </div>

  </div><!-- /container -->

  <script>

    // Step 1 - Create the favourite person object
    var favouritePerson = {
      name:         "Ifeoma",
      relationship: "My Sister",
      activity:     "Watching movies",
      city:         "Lagos",
      height:       "5'7",
      age:          "15 years old",
      school:       "Codingal School of coding",
      food:         "Boiled Yam",
      show:         "Sponge-Bob Square Pants",
      tone:         "Fair",

    };

    // Step 2 - Dot notation
    var nameEl = document.getElementById("name");
    var relationshipEl = document.getElementById("relationship");
    var foodEl = document.getElementById("food");
    var showEl = document.getElementById("show");
    var toneEl = document.getElementById("tone");
    nameEl.textContent = favouritePerson.name;
    relationshipEl.textContent = favouritePerson.relationship;
    foodEl.textContent = favouritePerson.food;
    showEl.textContent= favouritePerson.show;
    toneEl.textContent = favouritePerson.tone;

    // Step 3 - Bracket notation
    var activityEl = document.getElementById("activity");
    var cityEl = document.getElementById("city");
    var heightEl = document.getElementById("height");
    var ageEl = document.getElementById("age");
    var schoolEl = document.getElementById("school")
    activityEl.textContent = favouritePerson["activity"];
    cityEl.textContent = favouritePerson["city"];
    heightEl.textContent = favouritePerson["height"]
    ageEl.textContent = favouritePerson["age"];
    schoolEl.textContent = favouritePerson["school"];

    // Show the object in the code box
    var codeEl = document.getElementById("codeDisplay");
    // Show the object in the code box (pretty-printed JSON)
    codeEl.textContent = JSON.stringify(favouritePerson, null, 2);

  </script>

</body>
</html>
