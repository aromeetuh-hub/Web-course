<!DOCTYPE html>
<html>
<head>
  <title>David's Bank App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="app">

    <h1 id="app-title">David's bank</h1>

    <div id="balance-box">
      <p id="balance-label">Available balance</p>
      <p id="balance">$1000.00</p>
    </div>

    <div id="cash-flow">
        <p id="income">Cash-In = $1000.00</p>
        <p id="expenses">Cash-Out = $0.00</p>
        <p id="status">Cash Handling: <strong>Good</strong></p>
    </div>

    <div id="entry-box">
      <label id="amount-label" for="amount">Enter amount</label>
      <input type="number" id="amount" max="1000000" min="0">
    </div>

    <div id="button-box">
      <button class="action credit" id="credit-btn">Credit</button>
      <button class="action debit" id="debit-btn">Debit</button>
    </div>

    <p id="message"></p>
    <p id="note">Terms and conditions apply</p>

  </div>

  <script>
    // ---------- PART 1: helper functions ----------

function getBalance() {
    return Number(
        document.getElementById("balance").innerText.replace("$", "")
    );
}

function printBalance(num) {
    document.getElementById("balance").innerText = `$${num.toFixed(2)}`;
}

function getAmount() {
    return Number(document.getElementById("amount").value);
}

function showMessage(text) {
    document.getElementById("message").innerText = text;
}

function clearAmount() {
    document.getElementById("amount").value = "";
}


// ---------- PART 4: is the typed amount usable? ----------

function isAmountValid() {
    var typed = document.getElementById("amount").value;

    if (typed == "") {
        showMessage("Please enter an amount.");
        return false;
    } else if (Number(typed) <= 0) {
        showMessage("Amount must be more than zero.");
        return false;
    }

    return true;
}


// ---------- PART 2: Credit ----------

document.getElementById("credit-btn").addEventListener("click", function () {

    if (isAmountValid() == false) {
        return;
    }

    var amount = getAmount();
    var newBalance = getBalance() + amount;

    printBalance(newBalance);
    showMessage("Credited " + amount + " successfully.");
    clearAmount();

});


// ---------- PART 3 + PART 5: Debit ----------

document.getElementById("debit-btn").addEventListener("click", function () {

    if (isAmountValid() == false) {
        return;
    }

    var amount = getAmount();

    // PART 5 — you cannot spend money you do not have
    if (amount > getBalance()) {
        showMessage("Not enough balance.");
        return;
    }

    var newBalance = getBalance() - amount;

    printBalance(newBalance);
    showMessage("Debited " + amount + " successfully.");
    clearAmount();

});
  </script>

</body>
</html>
