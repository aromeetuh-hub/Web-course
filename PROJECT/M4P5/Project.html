<!DOCTYPE html>
<html>
  <body>
    <h2>JavaScript Objects Data Structure and Array</h2>
    <script>
var student = {
    name: 'Ifeoma',
    age: '15',
    Grade: '12',
    hobbies: 'Drawing',
    fav_sport: 'Football'
  };
   var color = ["white", "black", "red", "green", "blue"];
     document.write("Student name is : " + student.name,
     "<br>","Student favorite sport is : " +student.fav_sport); 
      document.write("<br>Before Popping the colors are: " + color.join("💖"));
      document.write("<br>My favorite color is : " +  color[1]);
       color.pop();
      document.write("<br>After Popping the colors are : " + color.join("⚽️"));
  </script>   
</body>
