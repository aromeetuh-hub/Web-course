<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>My Phone Contact</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f0f0f2;
      }
      h1 {
        color: #ff5a43;
      }
      .card-label {
        font-size: 11px;
        color: #999;
        text-transform: uppercase;
      }
      pre {
        font-size: 13px;
        color: #333;
      }
      .card {
        max-width: 400px;
      }
      .card-title, h6 {
        color: #ff5a43;
      }
    </style>
  </head>
  <body class="py-4">
    <div class="container">
      <h1 class="mb-1">My Phone Contact</h1>
      <p class="text-muted mb-4">
        Introduction to Objects in JavaScript
      </p>

      <!-- Contact Card -->
      <div class="card shadow-sm mb-3">
        <div class="card-body">
          <h5 class="card-title">Contact Details</h5>
          <ul class="list-group list-group-flush">
            <li class="list-group-item">
                <span class="card-label d-block">Name</span>
                <strong id="name"></strong>
            </li>

              <li class="list-group-item">
            <span class="card-label d-block">Phone</span>
            <strong id="phone"></strong>
            </li>

              <li class="list-group-item">
                <span class="card-label d-block">School</span>
                <strong id="school"></strong>
            </li>

              <li class="list-group-item">
                <span class="card-label d-block">City</span>
                <strong id="city"></strong>
            </li>
          </ul>
        </div>
      </div>

      <!-- Code Box -->
      <div class="card shadow-sm">
        <div class="card-body">
          <h6>JavaScript Object Used</h6>
          <pre id="codeDisplay" class="bg-light p-3 rounded border"></pre>
        </div>
      </div>
    </div>

    <script>
        let myContact ={
            name: "David",
            phone: "000999000",
            school: "Codingal institute of coding",
            city: "Lagos",
        }

        //STEP 2: Use the dot notation
        document.getElementById("name").textContent= myContact.name;

        document.getElementById("phone").textContent=myContact.phone;

        //STEP 3: Use the bracket notation
        document.getElementById("school").textContent=myContact["school"]

        document.getElementById("city").textContent= myContact["city"];

        //
        document.getElementById("codeDisplay").textContent= JSON.stringify(myContact);
    </script>
  </body>
</html>
