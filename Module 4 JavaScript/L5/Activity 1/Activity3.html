<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="result"></p>

    <script>
        function add(a, b, c) {
            return a + b + c;
        };

        function average(a, b, c) {
            return add(a, b, c)/ 3;
        };

        let result= average(101, 117, 999);
        document.getElementById("result").textContent = result;
    </script>
</body>
</html>
